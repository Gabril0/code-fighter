[package]
name = "code-fighter"
version = "0.2.0"
edition = "2021"

[lib]
name = "code_fighter"
path = "src/lib.rs"

[[bin]]
name = "code-fighter"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-util", "net", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0"
rustls-native-certs = "0.8"

[profile.release]
opt-level = 2
